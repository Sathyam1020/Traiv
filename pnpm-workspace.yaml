packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks a dependency's install scripts until somebody says yes, and with
# `strictDepBuilds` (the default since v11) an unanswered one fails the install rather
# than warning. This entry was auto-written by pnpm with a literal "set this to true or
# false" placeholder, which is not a boolean — so esbuild stayed unapproved and every
# cold install died with ERR_PNPM_IGNORED_BUILDS. It never showed up locally, because a
# warm node_modules makes install a no-op and no script runs at all.
#
# esbuild is here because tsx bundles it and it unpacks a platform binary on install.
# Nothing else in the tree is allowed to run a script.
allowBuilds:
  esbuild: true

# Single source of truth for every dependency version in the monorepo.
# Packages reference these with "catalog:" — never a literal version.
# Adding an entry here requires .ai/engineering/dependencies.md to have been followed.
catalog:
  # tooling
  typescript: ^7.0.2
  "@biomejs/biome": ^2.5.13
  turbo: ^2.10.12
  tsx: ^4.23.13
  vitest: ^5.0.0
  "@types/node": ^24.0.0

  # data
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  pg: ^8.23.0
  "@types/pg": ^8.11.10
  uuid: ^14.0.2
  zod: ^4.6.2
  dotenv: ^17.4.2

  # api
  express: ^5.2.1
  "@types/express": ^5.0.0

  # web
  next: ^16.3.4
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  motion: ^13.2.0
  sonner: ^2.0.8
  libphonenumber-js: ^1.13.14
  "@tanstack/react-query": ^5.102.8
  axios: ^1.20.0
  zustand: ^5.0.15
  qrcode.react: ^4.2.0
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  # shadcn/ui peers
  cn: ^0.2.6
  radix-ui: ^1.6.7
  class-variance-authority: ^0.7.1
  lucide-react: ^1.44.0
  tw-animate-css: ^1.4.0

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.13'
  - '@biomejs/cli-darwin-arm64@2.5.13'
  - '@biomejs/cli-darwin-x64@2.5.13'
  - '@biomejs/cli-linux-arm64-musl@2.5.13'
  - '@biomejs/cli-linux-arm64@2.5.13'
  - '@biomejs/cli-linux-x64-musl@2.5.13'
  - '@biomejs/cli-linux-x64@2.5.13'
  - '@biomejs/cli-win32-arm64@2.5.13'
  - '@biomejs/cli-win32-x64@2.5.13'
  - zod@4.6.2
